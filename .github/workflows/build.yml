name: Build TAPPY S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TAPPY-S3 Firmware
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v6.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test build tooling
        run: |
          python -m unittest discover -s scripts/tests -v

      - name: Build TAPPY-S3
        shell: bash
        run: |
          source $IDF_PATH/export.sh

          echo "======================================"
          echo "       BUILDING TAPPY ESP32-S3"
          echo "======================================"

          python scripts/build.py tappy-s3 --name tappy-s3 --language en-US --wake-word disabled

          echo "Configuring TAPPY custom wake word: Hi Tappy"
          cat > build/tappy-custom-wakeword.defaults <<'EOF'
          CONFIG_USE_CUSTOM_WAKE_WORD=y
          CONFIG_USE_AFE_WAKE_WORD=n
          CONFIG_USE_ESP_WAKE_WORD=n
          CONFIG_WAKE_WORD_DISABLED=n
          CONFIG_CUSTOM_WAKE_WORD="hi tappy"
          CONFIG_CUSTOM_WAKE_WORD_DISPLAY="Hi Tappy"
          CONFIG_CUSTOM_WAKE_WORD_THRESHOLD=20
          CONFIG_SEND_WAKE_WORD_DATA=y
          CONFIG_USE_AUDIO_PROCESSOR=y
          EOF

          export SDKCONFIG_DEFAULTS="sdkconfig.defaults;build/tappy-custom-wakeword.defaults"
          idf.py reconfigure
          idf.py build

      - name: Show build files
        shell: bash
        run: |
          echo "======================================"
          echo "BUILD OUTPUT"
          echo "======================================"

          find build -maxdepth 2 -type f -print

      - name: Upload TAPPY firmware
        uses: actions/upload-artifact@v4
        with:
          name: TAPPY-S3-Firmware
          path: |
            build/merged-binary.bin
            build/*.bin
          if-no-files-found: error
