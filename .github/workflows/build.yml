name: Build Boards

on:
  push:
    branches:
      - main
      - ci/*
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: Determine variants to build
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v6.1

    outputs:
      variants: ${{ steps.select.outputs.variants }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test build tooling
        run: |
          python -m unittest discover -s scripts/tests -v

      - name: Select variants
        id: select
        shell: bash
        run: |
          python scripts/build.py --list-boards --json > variants.json

          echo "Detected boards:"
          cat variants.json

          {
            echo "variants<<EOF"
            cat variants.json
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.full_name }}
    needs: prepare

    if: ${{ needs.prepare.outputs.variants != '[]' }}

    strategy:
      fail-fast: false

      matrix:
        include: ${{ fromJson(needs.prepare.outputs.variants) }}

    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v6.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build firmware
        shell: bash
        run: |
          source $IDF_PATH/export.sh

          python scripts/build.py \
            ${{ matrix.board }} \
            --name ${{ matrix.name }}

      - name: Upload firmware
        uses: actions/upload-artifact@v4
        with:
          name: xiaozhi-${{ matrix.full_name }}
          path: build/merged-binary.bin
          if-no-files-found: error
