name: Build TAPPY S3

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build TAPPY-S3 Firmware
    runs-on: ubuntu-latest

    container:
      image: espressif/idf:v6.1

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Test build tooling
        run: |
          python -m unittest discover -s scripts/tests -v

      - name: Build TAPPY-S3
        shell: bash
        run: |
          source $IDF_PATH/export.sh

          echo "======================================"
          echo "       BUILDING TAPPY ESP32-S3"
          echo "======================================"

          # Disable ESP-SR WakeNet for the stability build. The serial log
          # shows the firmware crashes immediately after loading srmodels,
          # before activation completes. Wake-word support will be added back
          # after the TAPPY audio path is stable.
          python scripts/build.py tappy-s3 --name tappy-s3 --language en-US --wake-word disabled

          idf.py build

      - name: Show build files
        shell: bash
        run: |
          echo "======================================"
          echo "BUILD OUTPUT"
          echo "======================================"

          find build -maxdepth 2 -type f -print

      - name: Upload TAPPY firmware
        uses: actions/upload-artifact@v4
        with:
          name: TAPPY-S3-Firmware
          path: |
            build/merged-binary.bin
            build/*.bin
          if-no-files-found: error
